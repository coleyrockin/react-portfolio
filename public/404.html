<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <!-- GitHub Pages serves this for any unknown path under the project site.
       The app is a hash-routed SPA whose only real URL is the root, so send
       stray deep links straight back to it. No inline script — meta refresh
       keeps this CSP-friendly. -->
  <meta http-equiv="refresh" content="0; url=/react-portfolio/" />
  <title>Redirecting — Boyd Roberts</title>
  <style>
    html {
      background: #020202;
      color: #f7f4ee;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    a {
      color: #c9a36a;
    }
  </style>
</head>

<body>
  <p>Redirecting to <a href="/react-portfolio/">Boyd Roberts&rsquo; portfolio</a>&hellip;</p>
</body>

</html>
